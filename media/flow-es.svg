<svg xmlns="http://www.w3.org/2000/svg" width="920" height="292" viewBox="0 0 920 292" role="img"><title>Cómo va una corrida</title><rect width="920" height="292" rx="20" fill="#0C0E14"/><text x="32" y="46" fill="#E7EBF5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Cómo va una corrida</text><rect x="32" y="72" width="248" height="150" rx="16" fill="#141824" stroke="#2A3144"/><text x="50" y="104" fill="#A7A7FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">01</text><text x="50" y="130" fill="#E7EBF5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Corres un comando</text><text x="50" y="158" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">init una vez. Luego upcoming,</text><text x="50" y="178" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">channels, o la parte que</text><text x="50" y="198" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">necesites.</text><path d="M288 138 l8 8 -8 8" fill="none" stroke="#6E778D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="72" width="248" height="150" rx="16" fill="#141824" stroke="#2A3144"/><text x="334" y="104" fill="#A7A7FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">02</text><text x="334" y="130" fill="#E7EBF5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Tu navegador abre Teams</text><text x="334" y="158" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Solo lectura, en un perfil</text><text x="334" y="178" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">que no es el de todos</text><text x="334" y="198" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">los días.</text><path d="M572 138 l8 8 -8 8" fill="none" stroke="#6E778D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="72" width="248" height="150" rx="16" fill="#141824" stroke="#2A3144"/><text x="618" y="104" fill="#A7A7FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">03</text><text x="618" y="130" fill="#E7EBF5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Las filas se quedan contigo</text><text x="618" y="158" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">SQLite y JSON en una</text><text x="618" y="178" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">carpeta que tú eliges.</text><text x="618" y="198" fill="#9AA3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">No se sube nada.</text><text x="32" y="258" fill="#3DCC8E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">No entrega una tarea ni publica un mensaje.</text></svg>